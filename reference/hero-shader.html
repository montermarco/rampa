<!doctype html>
<!--
  Referencia aprobada del shader del hero. El sitio lo porta tal cual en
  src/components/LineField.tsx (más el uniform u_energy para atenuarlo tras el hero).
  Se puede abrir directamente en el navegador para compararlo.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAMPA — shader de referencia</title>
<style>
  html { background: #f4f4f2; }
  body { margin: 0; min-height: 300vh; }
  #gl { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; display: block; }
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<script>
(function () {
  var canvas = document.getElementById('gl');
  var gl = canvas.getContext('webgl', { antialias: false, alpha: false, premultipliedAlpha: false });
  if (!gl) return;

  var vsSrc = 'attribute vec2 a; void main(){ gl_Position = vec4(a, 0.0, 1.0); }';

  var fsSrc = [
'precision highp float;',
'uniform vec2 u_resolution;',
'uniform vec2 u_mouse;',
'uniform float u_scrollSpeed;',
'uniform float u_time;',

'vec3 iridescence(float angle, float thickness){',
'  float delta = angle * 6.28318 + thickness * 8.0;',
'  return 0.5 + 0.5 * cos(delta + vec3(0.0, 2.2, 4.2));',
'}',

'float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }',

// distancia al segmento, en espacio corregido por aspecto
'float segDist(vec2 st, vec2 a, vec2 b, float aspect){',
'  vec2 A = vec2(st.x * aspect, st.y);',
'  vec2 P = vec2(a.x * aspect, a.y);',
'  vec2 Q = vec2(b.x * aspect, b.y);',
'  vec2 pa = A - P, ba = Q - P;',
'  float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);',
'  return length(pa - ba * h);',
'}',

// acumuladores globales
'float mCore;',   // nucleo nitido (para los cruces)
'float mGlow;',   // halo suave (el brillo)
'float mAngle;',  // angulo dominante, alimenta la iridiscencia

'void addLine(vec2 st, vec2 a, vec2 b, float width, float aspect, float drift){',
'  vec2 off = normalize(vec2(-(b.y - a.y), (b.x - a.x))) * drift;',
'  float d = segDist(st, a + off, b + off, aspect);',
'  mCore += smoothstep(width, width * 0.15, d);',
'  float w = width * 26.0;',
'  float g = w / (d + w);',
'  mGlow += g * g * g;',
'  float ang = atan(b.y - a.y, (b.x - a.x) * aspect);',
'  mAngle += ang * (g * g);',
'}',

'void main(){',
'  vec2 st = gl_FragCoord.xy / u_resolution.xy;',
'  vec2 mouse = u_mouse / u_resolution.xy;',
'  float aspect = u_resolution.x / u_resolution.y;',
'  float t = u_time;',
'  float sp = clamp(abs(u_scrollSpeed), 0.0, 1.0);',

'  mCore = 0.0; mGlow = 0.0; mAngle = 0.0;',

// respiracion lenta de los haces
'  float dr = 0.0016 * sin(t * 0.25);',

// haz horizontal
'  addLine(st, vec2(-0.1, 0.215), vec2(1.1, 0.232), 0.00075, aspect,  dr);',
'  addLine(st, vec2(-0.1, 0.220), vec2(1.1, 0.237), 0.00050, aspect,  0.0);',
'  addLine(st, vec2(-0.1, 0.226), vec2(1.1, 0.243), 0.00060, aspect, -dr);',
'  addLine(st, vec2(-0.1, 0.795), vec2(1.1, 0.770), 0.00060, aspect,  dr * 0.6);',
'  addLine(st, vec2(-0.1, 0.801), vec2(1.1, 0.776), 0.00045, aspect, -dr * 0.6);',

// haz vertical
'  addLine(st, vec2(0.198, -0.1), vec2(0.206, 1.1), 0.00070, aspect,  dr);',
'  addLine(st, vec2(0.780, -0.1), vec2(0.772, 1.1), 0.00080, aspect, -dr);',
'  addLine(st, vec2(0.786, -0.1), vec2(0.778, 1.1), 0.00050, aspect,  dr * 0.5);',

// diagonales en fuga
'  addLine(st, vec2(-0.05, 0.72), vec2(0.86, 0.10), 0.00070, aspect,  dr);',
'  addLine(st, vec2(-0.05, 0.745), vec2(0.86, 0.125), 0.00050, aspect, -dr);',
'  addLine(st, vec2(0.06, 0.99), vec2(0.84, 0.12), 0.00060, aspect,  dr * 0.7);',
'  addLine(st, vec2(0.58, 1.08), vec2(0.82, -0.06), 0.00070, aspect, -dr * 0.7);',
'  addLine(st, vec2(0.12, -0.08), vec2(1.05, 0.66), 0.00055, aspect,  dr * 0.4);',
'  addLine(st, vec2(0.12, -0.05), vec2(1.05, 0.69), 0.00040, aspect, -dr * 0.4);',

'  float core = clamp(mCore, 0.0, 1.0);',
'  float cross = smoothstep(1.15, 2.4, mCore);',        // donde se superponen varias rectas
'  float glow = mGlow;',
'  float ang = mAngle / max(glow, 0.001);',

'  float distToMouse = distance(vec2(st.x * aspect, st.y), vec2(mouse.x * aspect, mouse.y));',
'  float mouseGlow = smoothstep(0.42, 0.0, distToMouse);',

// color iridiscente: depende del angulo de la recta, del tiempo y de la distancia al cursor
'  float colorAngle = ang * 0.5 + dot(st - mouse, vec2(1.0, 0.6)) * 1.6 + t * 0.06;',
'  vec3 irid = iridescence(colorAngle, distToMouse + sp * 0.6);',

// energia: reposo tenue, se enciende con cursor y scroll
'  float energy = 0.22 + mouseGlow * 0.95 + sp * 1.35;',

'  vec3 bg = vec3(0.957, 0.957, 0.949);',
'  vec3 col = bg;',

// halo de color alrededor de cada recta
'  col += irid * glow * 0.10 * energy;',
// nucleo plateado de la recta
'  col += vec3(0.85) * core * (0.10 + 0.42 * energy);',
// cruces: blanco puro con borde iridiscente
'  col += (vec3(1.0) * 0.9 + irid * 0.7) * cross * (0.35 + 1.5 * energy);',
// destello de lente en los cruces cuando hay movimiento
'  float sparkle = pow(hash(floor(st * u_resolution.xy / 3.0) + floor(t * 14.0)), 9.0);',
'  col += irid * sparkle * cross * (mouseGlow * 2.2 + sp * 6.0);',
// flash global breve al girar la rueda
'  col += irid * glow * sp * sp * 0.20;',

// grano de lienzo
'  float grain = hash(gl_FragCoord.xy + fract(t) * 21.0);',
'  col += (grain - 0.5) * 0.014;',

'  gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);',
'}'
].join('\n');

  function compile(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); return null; }
    return s;
  }
  var vs = compile(gl.VERTEX_SHADER, vsSrc), fs = compile(gl.FRAGMENT_SHADER, fsSrc);
  if (!vs || !fs) return;
  var prog = gl.createProgram();
  gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(prog)); return; }
  gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  var aLoc = gl.getAttribLocation(prog, 'a');
  gl.enableVertexAttribArray(aLoc);
  gl.vertexAttribPointer(aLoc, 2, gl.FLOAT, false, 0, 0);

  var uRes = gl.getUniformLocation(prog, 'u_resolution');
  var uMouse = gl.getUniformLocation(prog, 'u_mouse');
  var uScroll = gl.getUniformLocation(prog, 'u_scrollSpeed');
  var uTime = gl.getUniformLocation(prog, 'u_time');

  var dpr = 1, mouse = [0, 0], targetMouse = [0, 0];
  var lastScroll = window.scrollY, velocity = 0, smoothVel = 0;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(uRes, canvas.width, canvas.height);
    targetMouse[0] = canvas.width * 0.5; targetMouse[1] = canvas.height * 0.55;
  }
  window.addEventListener('resize', resize);
  resize();
  mouse = targetMouse.slice();

  window.addEventListener('pointermove', function (e) {
    targetMouse[0] = e.clientX * dpr;
    targetMouse[1] = (window.innerHeight - e.clientY) * dpr;
  }, { passive: true });

  window.addEventListener('scroll', function () {
    var y = window.scrollY;
    velocity += (y - lastScroll) / window.innerHeight;
    lastScroll = y;
  }, { passive: true });

  var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function frame(ms) {
    var t = ms * 0.001;
    mouse[0] += (targetMouse[0] - mouse[0]) * 0.06;
    mouse[1] += (targetMouse[1] - mouse[1]) * 0.06;
    velocity *= 0.90;
    smoothVel += (Math.abs(velocity) * 3.2 - smoothVel) * 0.2;
    gl.uniform2f(uMouse, mouse[0], mouse[1]);
    gl.uniform1f(uScroll, still ? 0.0 : smoothVel);
    gl.uniform1f(uTime, still ? 8.0 : t);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
